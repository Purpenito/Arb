[project]
name = "arb-monitor-backend"
version = "0.1.0"
description = "Crypto arbitrage monitoring backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.31",
  "asyncpg>=0.29.0",
  "redis>=5.0.7",
  "httpx>=0.27.0",
  "python-telegram-bot>=21.4"
]

[tool.uv]
dev-dependencies = ["pytest>=8.2.0", "ruff>=0.5.0", "mypy>=1.10.0"]
