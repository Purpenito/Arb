[project]
name = "arb-scanner"
version = "0.1.0"
description = "Production-grade crypto derivatives arbitrage scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.2",
  "redis>=5.0.7",
  "aiohttp>=3.10.0",
  "websockets>=12.0",
  "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "aresponses>=3.0.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 100


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "frontend*"]

